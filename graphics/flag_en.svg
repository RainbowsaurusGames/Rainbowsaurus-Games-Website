<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <!-- Diagonale Schnittmasken für die beiden Hälften -->
    <clipPath id="top-left"><polygon points="0,0 600,0 0,300"/></clipPath>
    <clipPath id="bottom-right"><polygon points="600,0 600,300 0,300"/></clipPath>
    
    <!-- Ein vergrößerter, zentrierter 5-zackiger Stern -->
    <g id="star">
      <polygon points="0,-6.3 1.5,-2 6.3,-2 2.4,1 3.9,5.5 0,2.7 -3.9,5.5 -2.4,1 -6.3,-2 -1.5,-2" fill="#ffffff"/>
    </g>

    <!-- Eine Zeile mit 6 Sternen -->
    <g id="row6">
      <use href="#star" x="20" />
      <use href="#star" x="60" />
      <use href="#star" x="100" />
      <use href="#star" x="140" />
      <use href="#star" x="180" />
      <use href="#star" x="220" />
    </g>

    <!-- Eine versetzte Zeile mit 5 Sternen -->
    <g id="row5">
      <use href="#star" x="40" />
      <use href="#star" x="80" />
      <use href="#star" x="120" />
      <use href="#star" x="160" />
      <use href="#star" x="200" />
    </g>
  </defs>

  <!-- US Flagge (Oben Links) -->
  <g clip-path="url(#top-left)">
    <rect width="600" height="300" fill="#ffffff"/>
    <!-- Rote Streifen -->
    <rect y="0" width="600" height="23" fill="#B22234"/>
    <rect y="46" width="600" height="23" fill="#B22234"/>
    <rect y="92" width="600" height="23" fill="#B22234"/>
    <rect y="138" width="600" height="23" fill="#B22234"/>
    <rect y="184" width="600" height="23" fill="#B22234"/>
    <rect y="230" width="600" height="23" fill="#B22234"/>
    <rect y="276" width="600" height="24" fill="#B22234"/>
    
    <!-- Blaues Feld -->
    <rect width="240" height="161" fill="#3C3B6E"/>
    
    <!-- Die 50 Sterne präzise im Raster platziert -->
    <use href="#row6" y="16.1" />
    <use href="#row5" y="32.2" />
    <use href="#row6" y="48.3" />
    <use href="#row5" y="64.4" />
    <use href="#row6" y="80.5" />
    <use href="#row5" y="96.6" />
    <use href="#row6" y="112.7" />
    <use href="#row5" y="128.8" />
    <use href="#row6" y="144.9" />
  </g>

  <!-- UK Flagge (Unten Rechts) -->
  <g clip-path="url(#bottom-right)">
    <rect width="600" height="300" fill="#012169"/>
    <!-- Weiße Diagonalen -->
    <polygon points="0,0 60,0 600,270 600,300 540,300 0,30" fill="#ffffff"/>
    <polygon points="600,0 540,0 0,270 0,300 60,300 600,30" fill="#ffffff"/>
    <!-- Rote Diagonalen -->
    <polygon points="0,30 200,130 230,130 0,15" fill="#C8102E"/>
    <polygon points="600,270 400,170 370,170 600,285" fill="#C8102E"/>
    <polygon points="600,0 600,15 400,115 370,115" fill="#C8102E"/>
    <polygon points="0,300 0,285 200,185 230,185" fill="#C8102E"/>
    <!-- Weißes & Rotes Kreuz -->
    <rect x="250" y="0" width="100" height="300" fill="#ffffff"/>
    <rect x="0" y="100" width="600" height="100" fill="#ffffff"/>
    <rect x="270" y="0" width="60" height="300" fill="#C8102E"/>
    <rect x="0" y="120" width="600" height="60" fill="#C8102E"/>
  </g>

  <!-- Weiße Trennlinie -->
  <line x1="0" y1="300" x2="600" y2="0" stroke="#ffffff" stroke-width="12"/>
</svg>
